<!-- @dsCard group="Actions" height=120 subtitle="primary, secondary, ghost, danger; sizes sm, md, lg" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<div id="root" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px;background:var(--surface)"></div>
<script>
  var H = window.Handoff, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(H.Button, { variant: 'primary', size: 'lg' }, 'Confirmar venta'),
    h(H.Button, { variant: 'secondary' }, 'Ver orden'),
    h(H.Button, { variant: 'ghost' }, 'Cancelar'),
    h(H.Button, { variant: 'danger', size: 'sm' }, 'Revocar'),
    h(H.Button, { variant: 'primary', disabled: true }, 'Confirmar venta')
  ));
</script>
