<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<div id="root" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:16px;background:var(--surface)"></div>
<script>
  var H = window.Handoff, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(H.StatusPill, { status: 'verified' }),
    h(H.StatusPill, { status: 'blocked' }),
    h(H.StatusPill, { status: 'pending' }, 'Reporte pendiente'),
    h(H.StatusPill, { status: 'sponsored' }),
    h(H.StatusPill, { status: 'agent' }),
    h(H.StatusPill, { status: 'verified' }, 'KYC · tier 2')
  ));
</script>
