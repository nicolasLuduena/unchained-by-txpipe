<div id="root" style="display:grid;gap:12px;padding:16px;background:var(--ground);width:390px;box-sizing:border-box"></div>
<script src="../../vendor/react.production.min.js"></script>

  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(H.Notice, { status: 'blocked' }, 'Verificá tu identidad en la billetera para operar.'),
    h(H.Notice, { status: 'pending', word: 'Reporte pendiente' }, 'El registro todavía no confirmó esta venta.')
  ));
</script>
